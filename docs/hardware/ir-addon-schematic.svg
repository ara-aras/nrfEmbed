<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Consolas, 'Courier New', monospace" font-size="13">
  <title>nRFBox IR add-on schematic (TX driver + RX)</title>
  <rect width="900" height="640" fill="#ffffff"/>
  <g stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== ESP32 block ===== -->
    <rect x="40" y="180" width="150" height="300" fill="#fff8e1"/>
    <!-- ===== TX: base resistor ===== -->
    <line x1="190" y1="245" x2="230" y2="245"/>
    <rect x="230" y="237" width="60" height="16"/>
    <line x1="290" y1="245" x2="330" y2="245"/>

    <!-- Q1 S8050 -->
    <rect x="330" y="200" width="90" height="90" fill="#e8f1ff"/>
    <line x1="375" y1="200" x2="375" y2="190"/>
    <line x1="375" y1="290" x2="375" y2="320"/>
    <!-- GND symbol for emitter -->
    <line x1="360" y1="320" x2="390" y2="320"/>
    <line x1="366" y1="327" x2="384" y2="327"/>
    <line x1="372" y1="334" x2="378" y2="334"/>

    <!-- cathode bus + supply rail -->
    <line x1="375" y1="190" x2="700" y2="190"/>
    <line x1="500" y1="60" x2="700" y2="60"/>

    <!-- LED branch x=500 -->
    <line x1="500" y1="60" x2="500" y2="78"/><rect x="493" y="78" width="14" height="30"/><line x1="500" y1="108" x2="500" y2="118"/>
    <polygon points="490,118 510,118 500,138" fill="#ffe0e0"/><line x1="490" y1="138" x2="510" y2="138"/><line x1="500" y1="138" x2="500" y2="190"/>
    <!-- LED branch x=600 -->
    <line x1="600" y1="60" x2="600" y2="78"/><rect x="593" y="78" width="14" height="30"/><line x1="600" y1="108" x2="600" y2="118"/>
    <polygon points="590,118 610,118 600,138" fill="#ffe0e0"/><line x1="590" y1="138" x2="610" y2="138"/><line x1="600" y1="138" x2="600" y2="190"/>
    <!-- LED branch x=700 -->
    <line x1="700" y1="60" x2="700" y2="78"/><rect x="693" y="78" width="14" height="30"/><line x1="700" y1="108" x2="700" y2="118"/>
    <polygon points="690,118 710,118 700,138" fill="#ffe0e0"/><line x1="690" y1="138" x2="710" y2="138"/><line x1="700" y1="138" x2="700" y2="190"/>
    <!-- junction dots on bus -->
    <circle cx="500" cy="190" r="3" fill="#1a1a1a"/><circle cx="600" cy="190" r="3" fill="#1a1a1a"/>
    <circle cx="500" cy="60" r="3" fill="#1a1a1a"/><circle cx="600" cy="60" r="3" fill="#1a1a1a"/>

    <!-- IR emission arrows -->
    <g stroke="#c0392b" stroke-width="1.5">
      <line x1="716" y1="122" x2="730" y2="110"/><line x1="720" y1="132" x2="734" y2="120"/>
      <line x1="616" y1="122" x2="630" y2="110"/><line x1="620" y1="132" x2="634" y2="120"/>
      <line x1="516" y1="122" x2="530" y2="110"/><line x1="520" y1="132" x2="534" y2="120"/>
    </g>

    <!-- ===== RX ===== -->
    <!-- GPIO34 -> OUT -->
    <line x1="190" y1="400" x2="600" y2="400"/>
    <!-- 3V3 -> R2 -> node -> VS -->
    <line x1="190" y1="425" x2="280" y2="425"/>
    <rect x="280" y="417" width="60" height="16"/>
    <line x1="340" y1="425" x2="600" y2="425"/>
    <circle cx="440" cy="425" r="3" fill="#1a1a1a"/>
    <!-- C1 to ground -->
    <line x1="440" y1="425" x2="440" y2="460"/>
    <line x1="426" y1="460" x2="454" y2="460"/>
    <line x1="426" y1="470" x2="454" y2="470"/>
    <line x1="440" y1="470" x2="440" y2="520"/>
    <!-- ESP32 GND -> rail -->
    <line x1="190" y1="450" x2="240" y2="450"/>
    <line x1="240" y1="450" x2="240" y2="520"/>
    <line x1="240" y1="520" x2="560" y2="520"/>
    <circle cx="440" cy="520" r="3" fill="#1a1a1a"/>
    <!-- TSOP GND -->
    <line x1="600" y1="450" x2="560" y2="450"/>
    <line x1="560" y1="450" x2="560" y2="520"/>
    <!-- GND symbol on rail -->
    <line x1="400" y1="520" x2="400" y2="532"/>
    <line x1="385" y1="532" x2="415" y2="532"/>
    <line x1="391" y1="539" x2="409" y2="539"/>
    <line x1="397" y1="546" x2="403" y2="546"/>
    <!-- TSOP body -->
    <rect x="600" y="385" width="140" height="80" fill="#e9f7ec"/>
  </g>

  <!-- ===== Labels ===== -->
  <g fill="#1a1a1a">
    <text x="40" y="30" font-size="20" font-weight="bold">nRFBox IR add-on  -  TX driver + RX</text>
    <text x="40" y="50" fill="#555">Plugs into ESP32 GPIO13 (TX) and GPIO34 (RX). 3.3 V logic.</text>

    <text x="115" y="170" text-anchor="middle" font-weight="bold">ESP32-WROOM-32U</text>
    <text x="115" y="205" text-anchor="middle" fill="#555">(existing nRFBox MCU)</text>
    <text x="182" y="241" text-anchor="end">GPIO13 (IR_TX)</text>
    <text x="182" y="396" text-anchor="end">GPIO34 (IR_RX)</text>
    <text x="182" y="421" text-anchor="end">3V3</text>
    <text x="182" y="446" text-anchor="end">GND</text>

    <text x="260" y="228" text-anchor="middle">R1 470R</text>
    <text x="375" y="188" text-anchor="end" dx="-10" fill="#555">collector</text>
    <text x="345" y="253" fill="#555">B</text>
    <text x="383" y="310" fill="#555">E</text>
    <text x="375" y="252" text-anchor="middle" font-weight="bold" dy="30">Q1</text>
    <text x="375" y="236" text-anchor="middle">S8050</text>
    <text x="375" y="250" text-anchor="middle" fill="#555">NPN</text>

    <text x="500" y="52" text-anchor="middle">+VBAT rail (3.7-5 V)</text>
    <text x="520" y="98">R3 22R</text><text x="620" y="98">R4 22R</text><text x="720" y="98">R5 22R</text>
    <text x="520" y="152">D1</text><text x="620" y="152">D2</text><text x="720" y="152">D3</text>
    <text x="500" y="214" text-anchor="middle" fill="#555">D1-D3 = TSAL6200 (940 nm)</text>
    <text x="710" y="214" text-anchor="end" fill="#555">each LED has its own resistor</text>

    <text x="310" y="413" text-anchor="middle">R2 100R</text>
    <text x="456" y="468">C1 4.7uF</text>
    <text x="670" y="410" text-anchor="middle" font-weight="bold">U1 TSOP38238</text>
    <text x="670" y="428" text-anchor="middle" fill="#555">(or VS1838B)</text>
    <text x="608" y="404" font-size="11">OUT</text>
    <text x="608" y="429" font-size="11">VS</text>
    <text x="608" y="454" font-size="11">GND</text>

    <text x="40" y="580" fill="#555">Add-on design by the nRFBox IR fork. Based on nRFBox by CiferTech (MIT) - github.com/cifertech/nRFBox.</text>
    <text x="40" y="600" fill="#555">Original nRFBox PCB/schematic is CiferTech's work and is not reproduced here.</text>
  </g>
</svg>
